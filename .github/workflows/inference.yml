name: Inference checks
on:
  push:
  pull_request:
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-build-isolation ./acceleration
          python -m pytest -q tests
          cd Quad-LIC
          python setup_entropy.py build_ext --inplace
          python -m pytest -q tests
